version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/CSteroid"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/examples/HexagonalDdd"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Keeps the actions in your workflows up to date (and safe).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
